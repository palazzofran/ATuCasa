<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>try{var t=localStorage.getItem('atc_tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATuCasa — Pedí lo que quieras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./static/css/style.css?v=6">
</head>
<body>

<script src="./static/js/api.js?v=6"></script>
<script src="./static/js/auth.js?v=6"></script>
<script src="./static/js/carrito.js?v=6"></script>
<script src="./static/js/navbar.js?v=6"></script>

<div class="wrap">

  <section class="hero">
    <div class="hero-label"><div class="pulse"></div> Disponible en tu zona</div>
    <h1>Pedí lo que<br>quieras, <em>ahora.</em></h1>
    <p>Restaurantes, supermercados y farmacias. Todo en un solo lugar, en minutos.</p>
    <div class="hero-stats">
      <div class="stat"><div class="stat-n" id="stat-locales">—</div><div class="stat-l">Locales activos</div></div>
      <div class="stat-sep"></div>
      <div class="stat"><div class="stat-n">~30m</div><div class="stat-l">Entrega promedio</div></div>
      <div class="stat-sep"></div>
      <div class="stat"><div class="stat-n">4.8 <i class="fa-solid fa-star" style="color:#f59e0b;font-size:18px"></i></div><div class="stat-l">Calificación</div></div>
    </div>
  </section>

  <div class="filters" id="filtros">
    <div class="filter-chip active" data-cat=""><i class="fa-solid fa-border-all"></i> Todos</div>
    <div class="filter-chip" data-cat="comida"><i class="fa-solid fa-utensils"></i> Comida</div>
    <div class="filter-chip" data-cat="hamburguesas"><i class="fa-solid fa-burger"></i> Hamburguesas</div>
    <div class="filter-chip" data-cat="pizza"><i class="fa-solid fa-pizza-slice"></i> Pizza</div>
    <div class="filter-chip" data-cat="sushi"><i class="fa-solid fa-fish"></i> Sushi</div>
    <div class="filter-chip" data-cat="mercado"><i class="fa-solid fa-basket-shopping"></i> Mercado</div>
    <div class="filter-chip" data-cat="farmacia"><i class="fa-solid fa-pills"></i> Farmacia</div>
    <div class="filter-chip" data-cat="postres"><i class="fa-solid fa-ice-cream"></i> Postres</div>
  </div>

  <div class="section-header">
    <span class="section-title">Populares cerca tuyo</span>
    <a href="#" class="section-link">Ver todos <i class="fa-solid fa-arrow-right"></i></a>
  </div>

  <div class="grid" id="grid-locales">
    <div style="grid-column:1/-1;text-align:center;padding:60px 0">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<!-- Carrito flotante -->
<a href="./views/checkout.html" class="cart-pill hidden" id="cart-pill">
  <div class="cart-count">0</div>
  <span class="cart-txt">Ver mi pedido</span>
  <span class="cart-price">$0</span>
  <i class="fa-solid fa-chevron-right cart-arrow"></i>
</a>

<script>
let favoritos = new Set();        // ids de los locales favoritos del usuario
let filtroCategoria = '';         // '' = todos, '__fav' = solo favoritos
let busqueda = new URLSearchParams(location.search).get('q') || '';
let _pedidoActual = 0;            // para descartar respuestas viejas si se escribe rápido

// Avisa a navbar.js que la búsqueda se resuelve acá, sin cambiar de página
window.ATC_BUSQUEDA_EN_PAGINA = true;

function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function cargarFavoritos() {
  if (!estaLogueado()) return;
  try {
    const locales = await api.get('/favoritos');
    favoritos = new Set(locales.map(l => l.id));
  } catch (e) {
    favoritos = new Set();
  }
}

function _estadoVacio(icono, titulo, texto) {
  return `
    <div class="empty-state" style="grid-column:1/-1">
      <i class="fa-solid ${icono}"></i>
      <h3>${titulo}</h3>
      <p>${texto}</p>
    </div>`;
}

function _actualizarTitulo() {
  const titulo = document.querySelector('.section-title');
  if (busqueda) titulo.textContent = `Resultados para "${busqueda}"`;
  else if (filtroCategoria === '__fav') titulo.textContent = 'Tus favoritos';
  else titulo.textContent = 'Populares cerca tuyo';
}

async function cargarLocales() {
  const grid = document.getElementById('grid-locales');
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0"><div class="spinner"></div></div>';
  _actualizarTitulo();
  const pedido = ++_pedidoActual;

  try {
    const params = new URLSearchParams();
    if (filtroCategoria && filtroCategoria !== '__fav') params.set('categoria', filtroCategoria);
    if (busqueda) params.set('q', busqueda);
    let locales = await api.get('/locales' + (params.toString() ? '?' + params : ''));
    if (pedido !== _pedidoActual) return;   // llegó una búsqueda más nueva

    if (!filtroCategoria && !busqueda) {
      document.getElementById('stat-locales').textContent = locales.length + '+';
    }
    if (filtroCategoria === '__fav') locales = locales.filter(l => favoritos.has(l.id));

    if (locales.length === 0) {
      if (filtroCategoria === '__fav' && !busqueda) {
        grid.innerHTML = _estadoVacio('fa-heart', 'Todavía no tenés favoritos', 'Tocá el corazón de un local para guardarlo acá.');
      } else if (busqueda) {
        grid.innerHTML = _estadoVacio('fa-magnifying-glass', `No encontramos nada para "${esc(busqueda)}"`, 'Probá con otra palabra o con otra categoría.');
      } else {
        grid.innerHTML = _estadoVacio('fa-store-slash', 'No hay locales disponibles', 'Intentá con otra categoría.');
      }
      return;
    }

    grid.innerHTML = locales.map(renderCard).join('');
  } catch (e) {
    if (pedido !== _pedidoActual) return;
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <i class="fa-solid fa-plug-circle-exclamation"></i>
        <h3>Sin conexión al servidor</h3>
        <p>Verificá que el backend esté corriendo en <strong>localhost:8000</strong></p>
        <br><button class="btn-primary" onclick="cargarLocales()" style="margin-top:16px">
          <i class="fa-solid fa-rotate-right"></i> Reintentar
        </button>
      </div>`;
  }
}

function renderCard(local) {
  const img = local.imagen_url || `https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&q=70`;
  const envio = local.envio_gratis ? 'Gratis' : `$${(local.costo_envio || 350).toLocaleString('es-AR')}`;
  const tiempo = local.tiempo_entrega || '25–40';
  const rating = local.rating || '4.7';
  const fav = favoritos.has(local.id);

  return `
  <div class="card" onclick="window.location.href='./views/local.html?id=${local.id}'">
    <div class="card-img">
      <img src="${esc(img)}" alt="${esc(local.nombre)}" loading="lazy"
           onerror="this.src='https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=600&q=70'">
      <div class="card-badge open"><div class="dot"></div>${local.activo ? 'Abierto' : 'Cerrado'}</div>
      <button type="button" class="card-fav ${fav ? 'active' : ''}"
              aria-label="${fav ? 'Quitar de favoritos' : 'Agregar a favoritos'}" aria-pressed="${fav}"
              onclick="event.stopPropagation();toggleFavorito(${local.id}, this)">
        <i class="fa-heart ${fav ? 'fa-solid' : 'fa-regular'}"></i>
      </button>
    </div>
    <div class="card-body">
      <div class="card-top">
        <div class="card-name">${esc(local.nombre)}</div>
        <div class="card-rating"><i class="fa-solid fa-star"></i> ${rating}</div>
      </div>
      <div class="card-meta">
        <span><i class="fa-regular fa-clock"></i> ${tiempo} min</span>
        <span><i class="fa-solid fa-motorcycle"></i> ${envio}</span>
      </div>
      <div class="card-footer">
        <div class="card-category"><div class="cat-dot"></div>${esc(local.categoria || 'General')}</div>
        <button class="btn-order" onclick="event.stopPropagation();window.location.href='./views/local.html?id=${local.id}'">
          <i class="fa-solid fa-plus"></i> Pedir
        </button>
      </div>
    </div>
  </div>`;
}

function _pintarCorazon(btn, fav) {
  btn.classList.toggle('active', fav);
  btn.setAttribute('aria-pressed', fav);
  btn.setAttribute('aria-label', fav ? 'Quitar de favoritos' : 'Agregar a favoritos');
  btn.querySelector('i').className = `fa-heart ${fav ? 'fa-solid' : 'fa-regular'}`;
}

async function toggleFavorito(idLocal, btn) {
  if (!estaLogueado()) {
    _mostrarToast('Iniciá sesión para guardar favoritos');
    setTimeout(() => {
      window.location.href = './views/login.html?next=' + encodeURIComponent('../index.html');
    }, 1200);
    return;
  }

  const eraFavorito = favoritos.has(idLocal);
  // Se pinta al instante y se revierte si el servidor falla
  eraFavorito ? favoritos.delete(idLocal) : favoritos.add(idLocal);
  _pintarCorazon(btn, !eraFavorito);
  btn.disabled = true;

  try {
    if (eraFavorito) await api.delete(`/favoritos/${idLocal}`);
    else await api.put(`/favoritos/${idLocal}`);
    _mostrarToast(eraFavorito ? 'Quitado de favoritos' : 'Guardado en favoritos');
    if (eraFavorito && filtroCategoria === '__fav') cargarLocales();
  } catch (e) {
    eraFavorito ? favoritos.add(idLocal) : favoritos.delete(idLocal);
    _pintarCorazon(btn, eraFavorito);
    _mostrarToast('No se pudo guardar el favorito. Probá de nuevo.');
  } finally {
    btn.disabled = false;
  }
}

// Filtro "Favoritos": solo para usuarios registrados
if (estaLogueado()) {
  document.querySelector('.filter-chip[data-cat=""]').insertAdjacentHTML('afterend',
    '<div class="filter-chip" data-cat="__fav"><i class="fa-solid fa-heart"></i> Favoritos</div>');
}

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    filtroCategoria = chip.dataset.cat;
    cargarLocales();
  });
});

// Buscador: busca en el servidor (locales y productos) al dejar de escribir
let _esperaBusqueda;
document.getElementById('search-input')?.addEventListener('input', (e) => {
  clearTimeout(_esperaBusqueda);
  _esperaBusqueda = setTimeout(() => {
    busqueda = e.target.value.trim();
    const url = new URL(location.href);
    busqueda ? url.searchParams.set('q', busqueda) : url.searchParams.delete('q');
    history.replaceState(null, '', url);
    cargarLocales();
  }, 250);
});

(async () => {
  await cargarFavoritos();
  cargarLocales();
})();
</script>

</body>
</html>
